name: Wire Swappys Variant Home

on:
  workflow_dispatch:
  push:
    paths:
      - .github/swappys-virelle-fix-trigger

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire Swappys home and add contract test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/(tabs)/index.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const marker = '  return (\n    <ScreenContainer containerClassName="bg-background">';
          if (!s.includes('if (IS_SWAPPYS) return <BodyFaceSwap />;')) {
            if (!s.includes(marker)) throw new Error('Home return anchor missing');
            s = s.replace(marker, '  if (IS_SWAPPYS) return <BodyFaceSwap />;\n\n' + marker);
          }
          s = s.replace(/\n\s*\{\/\* ── Swappys Identity Banner[\s\S]*?\n\s*\{\/\* ── Credits & Plan Card/g,
            '\n\n          {/* ── Credits & Plan Card');
          fs.writeFileSync(path, s);

          const test = `import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst home = readFileSync("app/(tabs)/index.tsx", "utf8");\nconst config = readFileSync("app.config.ts", "utf8");\n\ndescribe("app variant contract", () => {\n  it("routes the Swappys build directly to the native transformation experience", () => {\n    expect(home).toContain('if (IS_SWAPPYS) return <BodyFaceSwap />;');\n    expect(home).not.toContain('Swappys Identity Banner');\n  });\n\n  it("keeps Virelle as the safe default while allowing an explicit Swappys build", () => {\n    expect(config).toContain('EXPO_PUBLIC_APP_VARIANT === "swappys"');\n    expect(config).toContain('appVariant');\n    expect(config).toContain('canonicalWebApp: "https://virelle.life"');\n  });\n});\n`;
          fs.writeFileSync('tests/appVariantContract.test.ts', test);
          NODE
      - name: Validate
        run: |
          pnpm check
          pnpm lint
          pnpm test
          pnpm build
          pnpm doctor
          node scripts/security-audit.mjs
      - name: Commit wiring fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/index.tsx' tests/appVariantContract.test.ts
          git commit -m "fix(mobile): wire Swappys build to native swap experience"
          git push origin HEAD:main
