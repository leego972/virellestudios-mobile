name: Mobile Dependency Security Autofix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/mobile-security-fix-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pnpm security fixes
        shell: bash
        run: |
          pnpm audit --fix || true
          pnpm install --no-frozen-lockfile
      - name: Validate repaired dependency graph
        shell: bash
        run: |
          pnpm check
          pnpm test
          pnpm build
          pnpm doctor
          pnpm audit --audit-level moderate
      - name: Commit dependency repair
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency graph already clean; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix(mobile): patch audited dependency vulnerabilities"
          git push origin HEAD:main
